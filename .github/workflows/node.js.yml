name: Build and publish MunichWays GeoJSON

on:
  workflow_dispatch:
  schedule:
    # 20:00 Europe/Berlin: UTC+2 in summer, UTC+1 in winter.
    - cron: '0 18 * * 0'
    - cron: '0 19 * * 0'

permissions:
  contents: read

concurrency:
  group: geojson-publication
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.time.outputs.run }}
    steps:
      - id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo('Europe/Berlin'))
          # Select the correct UTC slot by offset, even if the runner starts late.
          utc_hour = 20 - int(now.utcoffset().total_seconds() / 3600)
          scheduled_hour = int(os.environ['CRON'].split()[1]) if os.environ['CRON'] else utc_hour
          run = os.environ['EVENT_NAME'] != 'schedule' or scheduled_hour == utc_hour
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(run).lower()}\n')
          PY
  build:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate GeoJSON from fresh source data
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          trap 'rm -f secret.json' EXIT
          printf '%s' "$SERVICE_ACCOUNT_JSON" > secret.json
          node create_geojson.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: geojson
          if-no-files-found: error
          path: |
            IST_RadlVorrangNetz_MunichWays_V20.geojson
            IST_RadlVorrangNetz_Oberbayern_V20.geojson
            happy_bike_level_munich.geojson
            happy_bike_level_munich_RV.geojson
            happy_bike_level_oberbayern.geojson
      - name: Publish to Google Drive
        env:
          GOOGLE_DRIVE_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_UPLOAD_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_DOWNLOAD_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_DOWNLOAD_FOLDER_ID }}
        run: node scripts/publish_geojson.mjs

      - name: Prepare FTP upload
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_TIME="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          echo "DEPLOY_TIME=$DEPLOY_TIME" >> "$GITHUB_ENV"

          mkdir -p ftp-upload/current ftp-upload/save

          files=(
            IST_RadlVorrangNetz_MunichWays_V20.geojson
            IST_RadlVorrangNetz_Oberbayern_V20.geojson
            happy_bike_level_munich.geojson
            happy_bike_level_munich_RV.geojson
            happy_bike_level_oberbayern.geojson
          )

          for file in "${files[@]}"; do
            cp "$file" "ftp-upload/current/$file"
            cp "$file" "ftp-upload/save/${file%.geojson}_$DEPLOY_TIME.geojson"
          done

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Upload GeoJSON files to webspace
        shell: bash
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_PATH: .
          FTP_SAVE_PATH: /save
        run: |
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::FTP_SERVER and FTP_USERNAME must be Repository Variables; FTP_PASSWORD must be a Repository Secret."
            exit 1
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no

          set cmd:fail-exit no
          mkdir -p "$FTP_SAVE_PATH"
          set cmd:fail-exit yes

          mirror --reverse --overwrite --verbose ftp-upload/current "$FTP_TARGET_PATH"
          mirror --reverse --overwrite --verbose ftp-upload/save "$FTP_SAVE_PATH"

          bye
          EOF

      - name: Verify FTP upload
        shell: bash
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_PATH: .
          FTP_SAVE_PATH: /save
        run: |
          set -euo pipefail

          files=(
            IST_RadlVorrangNetz_MunichWays_V20.geojson
            IST_RadlVorrangNetz_Oberbayern_V20.geojson
            happy_bike_level_munich.geojson
            happy_bike_level_munich_RV.geojson
            happy_bike_level_oberbayern.geojson
          )

          for file in "${files[@]}"; do
            backup="${file%.geojson}_$DEPLOY_TIME.geojson"

            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            cls "$FTP_TARGET_PATH/$file"
            cls "$FTP_SAVE_PATH/$backup"
            bye
          EOF
          done

          echo "Successfully uploaded and verified ${#files[@]} current files and ${#files[@]} backups."
